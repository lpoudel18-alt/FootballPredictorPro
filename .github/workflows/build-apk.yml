
name: Build Football Predictor Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          ROOT=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$ROOT" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$ROOT")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictorPro-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
